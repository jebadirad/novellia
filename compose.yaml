services:
  db:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:54329:5432'
    environment:
      POSTGRES_USER: novellia
      POSTGRES_PASSWORD: novellia
      POSTGRES_DB: novellia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U novellia -d novellia']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
